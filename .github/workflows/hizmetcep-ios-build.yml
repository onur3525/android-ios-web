name: HizmetCep iOS Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    name: Build HizmetCep iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Verify iOS build
        run: |
          echo "iOS build kontrolü:"
          ls -lah build/ios/iphoneos/ || true
          ls -lah build/ios/iphoneos/Runner.app || true

      - name: Create unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r HizmetCep-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          echo "IPA oluşturuldu:"
          ls -lh HizmetCep-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hizmetcep-ios-ipa
          path: HizmetCep-unsigned.ipa
          if-no-files-found: error
