# ═══════════════════════════════════════════════════════════════
# YÜK TESTİ — ELLE BAŞLATILAN, KADEMELİ, SALT OKUMA (28 Eki 2026)
#
# • Yalnız ELLE başlar (Actions → yuk-testi → Run workflow); push ya da
#   zamanlamayla ASLA kendiliğinden çalışmaz.
# • Onay metni birebir: YUKTESTI  (yanlışlıkla tıklamaya karşı).
# • Yalnız giriş istemeyen GET uçları; canlı veriye yazmaz, sır kullanmaz.
# • Hata %1'i ya da p95 500 ms'yi aşarsa test kendiliğinden durur.
# • Sonuç özeti işin "Summary" sayfasında ve sonuc.json ürününde.
# Betik: yuk-testi/kademeli.js
# ═══════════════════════════════════════════════════════════════
name: yuk-testi
on:
  workflow_dispatch:
    inputs:
      hedef_rps:
        description: 'Ulaşılacak en yüksek saniyedeki istek (10–500)'
        required: true
        default: '500'
      taban_url:
        description: 'Test edilecek backend adresi'
        required: true
        default: 'https://hizmetcep-backend.onrender.com'
      onay:
        description: 'Birebir yazın: YUKTESTI'
        required: true
        default: ''
permissions:
  contents: read
concurrency:
  group: yuk-testi
  cancel-in-progress: false
jobs:
  kademeli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Onay denetimi
        if: ${{ inputs.onay != 'YUKTESTI' }}
        run: |
          echo "::error::Onay metni hatalı. Test başlatılmadı."
          exit 1
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      # Test adımı k6 durdursa bile BAŞARISIZ OLMAZ (sonraki özet adımları
      # çalışsın diye); çıkış kodu ve süre kaydedilir, KARAR en sondaki
      # "Karar" adımında verilir. (Eski hata: `| tee` k6'nın çıkış kodunu
      # gizliyordu; eşikte durdurulan test "başarılı" görünüyordu.)
      - name: Kademeli yük testi
        env:
          HEDEF_RPS: ${{ inputs.hedef_rps }}
          TABAN_URL: ${{ inputs.taban_url }}
        shell: bash
        run: |
          set +e -o pipefail
          bas=$(date +%s)
          k6 run --summary-export=sonuc.json yuk-testi/kademeli.js 2>&1 | tee cikti.txt
          echo "${PIPESTATUS[0]}" > k6_cikis.txt
          echo $(( $(date +%s) - bas )) > k6_sure.txt
          exit 0
      - name: Özet
        if: always()
        run: |
          {
            echo "## Yük testi sonucu"
            echo '```'
            sed -n '/█ THRESHOLDS/,$p' cikti.txt 2>/dev/null || tail -60 cikti.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sonuç notları (rakamlar API'den de okunabilsin)
        if: always()
        run: |
          [ -f sonuc.json ] || { echo "::warning::sonuc.json yok (test başlamadan durdu)"; exit 0; }
          jq -r '.metrics as $m
            | "::notice title=Genel::istek=\($m.http_reqs.count) hiz=\($m.http_reqs.rate|floor)/sn hata=\(($m.http_req_failed.value*10000|floor)/100)% p95=\($m.http_req_duration["p(95)"]|floor)ms p99=\($m.http_req_duration["p(99)"]|floor)ms max=\($m.http_req_duration.max|floor)ms dusen=\($m.dropped_iterations.count // 0) vu_max=\($m.vus_max.max // $m.vus_max.value // 0)",
              ($m | to_entries[] | select(.key|startswith("http_req_duration{uc:"))
                | "::notice title=\(.key|ltrimstr("http_req_duration{uc:")|rtrimstr("}"))::ort=\(.value.avg|floor)ms p95=\(.value["p(95)"]|floor)ms p99=\(.value["p(99)"]|floor)ms max=\(.value.max|floor)ms")' sonuc.json
          grep -E "thresholds on metrics .* crossed|aborted" cikti.txt | head -3 | sed 's/^/::warning title=Durdu::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuk-testi-sonucu
          path: |
            sonuc.json
            cikti.txt
            k6_cikis.txt
            k6_sure.txt
          retention-days: 30
      # KARAR: aşağıdakilerden BİRİ bile varsa iş BAŞARISIZ (kırmızı) olur:
      #   1) k6 sıfır dışı kodla bitti (eşik aşımı, erken durdurma, betik hatası)
      #   2) sonuc.json yok ya da okunamıyor (test hiç başlamadı / yarıda öldü)
      #   3) sonuc.json'da aşılmış (true) bir eşik var
      #   4) test planlanan süreyi tamamlamadı (eksik test)
      - name: Karar
        if: always()
        shell: bash
        env:
          HEDEF_RPS: ${{ inputs.hedef_rps }}
        run: bash yuk-testi/karar.sh
