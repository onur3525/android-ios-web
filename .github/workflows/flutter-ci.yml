# ═══════════════════════════════════════════════════════════════
# HizmetCep Flutter — derleme doğrulaması (analyze · test · Android debug · Web debug)
#
# Yalnız DOĞRULAMA yapar; GitHub Pages yayınına DOKUNMAZ (mevcut yayın
# iş akışınız aynen çalışır). Amaç: Firebase Auth/FCM paketlerinin ve
# Android Gradle Plugin 9 araç zincirinin GERÇEK derlemede doğrulanması.
# ═══════════════════════════════════════════════════════════════
name: flutter-ci
on:
  push:
    paths-ignore: ['backend/**', 'admin/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Kilit depoda yoksa `flutter pub get` pub.dev'den GERÇEKTEN çözülen
      # pubspec.lock üretir; o dosya (ve hangi Flutter/Dart sürümüyle
      # üretildiği) indirilebilir ürün olarak saklanır. İndirip depo köküne
      # `pubspec.lock` olarak işleyin (docs/kilit_dosyalari.md). Kilit
      # depodaysa bu adımlar atlanır ve `pub get` kilide UYAR.
      - id: kilit
        run: |
          if [ -f pubspec.lock ]; then echo "uretildi=0" >> "$GITHUB_OUTPUT"; else echo "uretildi=1" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
      - name: Üretilen kilit dosyasını sakla
        if: steps.kilit.outputs.uretildi == '1'
        run: flutter --version --machine > flutter-surumu.json
      - if: steps.kilit.outputs.uretildi == '1'
        uses: actions/upload-artifact@v6
        with:
          name: flutter-pubspec-lock
          path: |
            pubspec.lock
            flutter-surumu.json
          retention-days: 30
      # Bağımlılık çözümü raporu: firebase_core / firebase_messaging / firebase_auth sürümleri
      - run: flutter pub deps --style=compact | grep -E "firebase_(core|auth|messaging)" || true
      # Gizli bilgi taraması (15 Eki güvenlik denetimi; backend iş akışında da var).
      - name: Gizli bilgi taraması
        run: node .github/scripts/gizli_tarama.mjs
      - name: flutter analyze
        # Bulgular GitHub uyarısı (annotation) olarak da yazılır: günlük
        # indirilemediğinde neden okunabilsin. Kural ve çıkış kodu AYNEN.
        run: |
          set +e
          flutter analyze --no-fatal-infos
          durum=$?
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 && $1!="INFO" {printf "::error file=%s,line=%s,col=%s::%s %s: %s\n",$4,$5,$6,$1,$3,$8}'
          exit $durum
      # Analyze başarısız olsa da testler ÇALIŞIR (kullanıcı kararı, 3 Eki):
      # analyze kuralı (--no-fatal-infos) AYNEN geçerli ve iş yine kırmızı
      # olur; yalnız test paketinin gerçek durumu görülebilsin diye.
      # Makine çıktısı ayrıca işlenir: başarısız testlerin adı ve hata
      # mesajı GitHub uyarısı (annotation) olarak yazılır; günlük
      # indirilemediğinde de neden okunabilir. Sonuç (çıkış kodu) AYNEN.
      - name: flutter test
        if: always()
        run: |
          set +e
          flutter test --machine > test-sonuc.jsonl
          durum=$?
          node .github/scripts/test_hatalari.mjs test-sonuc.jsonl
          exit $durum
      # ── SERTİFİKA SABİTLEME — PİNLİ YOL (29 Eki, güvenlik planı) ──
      # Pin listesi derleme zamanında sabitlendiği için normal test koşusunda
      # pinli yol SINANAMAZ (testler atlanır). Bu adım GEÇİCİ test
      # sertifikaları üretir (anahtar depoya işlenmez, yalnız bu koşunun geçici
      # dizininde) ve pinli derleme ayarıyla doğru pin / yanlış pin / yanlış
      # ad / süresi dolmuş sertifika / WebSocket senaryolarını çalıştırır.
      - name: Sertifika sabitleme testi (pinli)
        if: always()
        run: |
          set +e
          d="$(mktemp -d)"
          python3 -m venv "$d/py" && "$d/py/bin/pip" install -q cryptography
          pinler="$("$d/py/bin/python" .github/scripts/pin_test_sertifikalari.py "$d/sertifika")"
          flutter test --machine \
            --dart-define=CERT_PINS="$pinler" \
            --dart-define=API_BASE_URL=https://localhost/api/v1 \
            --dart-define=PIN_TEST_DIZINI="$d/sertifika" \
            test/sertifika_pinli_test.dart test/sertifika_bolge_test.dart > pin-sonuc.jsonl
          durum=$?
          node .github/scripts/test_hatalari.mjs pin-sonuc.jsonl
          rm -rf "$d"
          exit $durum

  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Gradle wrapper (tek kaynak betik)
        run: bash android/gradle_wrapper_hazirla.sh
      # ── SABİT DEBUG ANAHTARI ──
      #
      # ⚠ Her koşu kendi debug anahtarını üretirse yeni test APK'sı eski
      # kurulumun üzerine KURULAMAZ ("paket çakışıyor"). Gizli değer
      # tanımlıysa her koşu aynı anahtarla imzalar; tanımlı değilse
      # davranış eskisi gibidir. Yalnız `.debug` test paketini etkiler;
      # mağaza paketi (com.hizmetcep.app) bununla imzalanmaz.
      #
      # ⚠ DEĞER LOGA BASILMAZ; yalnız varlığı bildirilir.
      - name: Sabit debug anahtarı (varsa)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Sabit debug anahtarı kullanılıyor."
          else
            echo "DEBUG_KEYSTORE_B64 tanımlı değil: bu koşu geçici debug anahtarıyla imzalanır."
          fi
      # ⚠ 15 Eki (canlı hazırlığı): test APK'sı da test sitesi gibi gerçek
      # backend'e bağlanır; dağıtılan hiçbir pakette mock veri yoktur.
      - name: Android debug APK (gerçek API)
        run: flutter build apk --debug --dart-define=DATA_SOURCE=api --dart-define=API_BASE_URL=https://hizmetcep-backend.onrender.com/api/v1
      - name: Paket adı ve imza raporu
        run: |
          APK=$(find build/app/outputs -name '*.apk' | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/*/aapt dump badging "$APK" 2>/dev/null | head -1 || true
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"/apksigner verify --print-certs "$APK" | grep -E "SHA-1|SHA-256|DN" || true
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: build/app/outputs/**/*.apk
          retention-days: 7

  web-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Web debug (GitHub Pages ile aynı base-href)
        run: flutter build web --debug --base-href /android-ios-web/
      - name: Web push dosyaları çıktıda
        run: ls -la build/web/firebase-messaging-sw.js build/web/fcm_web.js build/web/fcm_yapilandirma.js
