# ═══════════════════════════════════════════════════════════════
# HizmetCep Flutter — derleme doğrulaması (analyze · test · Android debug · Web debug)
#
# Yalnız DOĞRULAMA yapar; GitHub Pages yayınına DOKUNMAZ (mevcut yayın
# iş akışınız aynen çalışır). Amaç: Firebase Auth/FCM paketlerinin ve
# Android Gradle Plugin 9 araç zincirinin GERÇEK derlemede doğrulanması.
# ═══════════════════════════════════════════════════════════════
name: flutter-ci
on:
  push:
    paths-ignore: ['backend/**', 'admin/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Kilit depoda yoksa `flutter pub get` pub.dev'den GERÇEKTEN çözülen
      # pubspec.lock üretir; o dosya (ve hangi Flutter/Dart sürümüyle
      # üretildiği) indirilebilir ürün olarak saklanır. İndirip depo köküne
      # `pubspec.lock` olarak işleyin (docs/kilit_dosyalari.md). Kilit
      # depodaysa bu adımlar atlanır ve `pub get` kilide UYAR.
      - id: kilit
        run: |
          if [ -f pubspec.lock ]; then echo "uretildi=0" >> "$GITHUB_OUTPUT"; else echo "uretildi=1" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
      - name: Üretilen kilit dosyasını sakla
        if: steps.kilit.outputs.uretildi == '1'
        run: flutter --version --machine > flutter-surumu.json
      - if: steps.kilit.outputs.uretildi == '1'
        uses: actions/upload-artifact@v6
        with:
          name: flutter-pubspec-lock
          path: |
            pubspec.lock
            flutter-surumu.json
          retention-days: 30
      # Bağımlılık çözümü raporu: firebase_core / firebase_messaging / firebase_auth sürümleri
      - run: flutter pub deps --style=compact | grep -E "firebase_(core|auth|messaging)" || true
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      # Analyze başarısız olsa da testler ÇALIŞIR (kullanıcı kararı, 3 Eki):
      # analyze kuralı (--no-fatal-infos) AYNEN geçerli ve iş yine kırmızı
      # olur; yalnız test paketinin gerçek durumu görülebilsin diye.
      - name: flutter test
        if: always()
        run: flutter test --reporter expanded

  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Gradle wrapper (tek kaynak betik)
        run: bash android/gradle_wrapper_hazirla.sh
      - name: Android debug APK (mock)
        run: flutter build apk --debug --dart-define=DATA_SOURCE=mock
      - name: Paket adı ve imza raporu
        run: |
          APK=$(find build/app/outputs -name '*.apk' | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/*/aapt dump badging "$APK" 2>/dev/null | head -1 || true
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"/apksigner verify --print-certs "$APK" | grep -E "SHA-1|SHA-256|DN" || true
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: build/app/outputs/**/*.apk
          retention-days: 7

  web-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Web debug (GitHub Pages ile aynı base-href)
        run: flutter build web --debug --base-href /android-ios-web/
      - name: Web push dosyaları çıktıda
        run: ls -la build/web/firebase-messaging-sw.js build/web/fcm_web.js build/web/fcm_yapilandirma.js
