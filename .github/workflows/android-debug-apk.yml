name: Build Android Debug APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout NEW ZIP project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK from NEW ZIP
        run: flutter build apk --debug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: HizmetCep Latest Debug APK
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/app-debug.apk
          overwrite_files: true
