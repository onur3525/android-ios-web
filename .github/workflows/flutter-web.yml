name: HizmetCep Web Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --debug --dart-define=ARAMA_IZ=true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hizmetcep-web
          path: build/web
