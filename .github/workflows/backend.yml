# ═══════════════════════════════════════════════════════════════
# HizmetCep backend — test (SQLite + GERÇEK PostgreSQL)
#
# Yalnız backend/ ve admin/ değişince çalışır; Flutter iş akışlarına
# dokunmaz. Aynı test paketi iki veritabanında koşar: SQLite (hızlı)
# ve PostgreSQL 16 hizmet kabı (canlı ile aynı sürücü).
# ═══════════════════════════════════════════════════════════════
name: backend
on:
  push:
    paths: ['backend/**', 'admin/**', 'lib/data/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'admin/**', 'lib/data/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc
          POSTGRES_PASSWORD: hc_test_only
          POSTGRES_DB: hizmetcep_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # İlk koşuda package-lock.json üretilir; depoya işlenmesi gerekir.
      - id: kurulum
        run: |
          if [ -f package-lock.json ]; then npm ci; echo "uretildi=0" >> "$GITHUB_OUTPUT"
          else npm install; echo "uretildi=1" >> "$GITHUB_OUTPUT"; fi
      # Kilit depoda YOKSA, bu koşuda npm kayıt defterinden GERÇEKTEN çözülen
      # kilit dosyası indirilebilir ürün olarak saklanır (elle yazılmaz).
      # İndirip backend/package-lock.json olarak depoya işleyin; sonraki
      # koşular `npm ci` kullanır ve bu adım atlanır (docs/kilit_dosyalari.md).
      - name: Üretilen kilit dosyasını sakla
        if: steps.kurulum.outputs.uretildi == '1'
        uses: actions/upload-artifact@v6
        with:
          name: backend-package-lock
          path: backend/package-lock.json
          retention-days: 30
      - name: SQLite
        run: npm test
      - name: PostgreSQL 16
        env:
          HC_TEST_DB: postgres
          HC_DATABASE_URL: postgres://hc:hc_test_only@localhost:5432/hizmetcep_test
        run: npm test
