name: HizmetCep APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter bağımlılıkları
        run: flutter pub get

      - name: Debug APK oluştur
        run: flutter build apk --debug --dart-define=DATA_SOURCE=mock

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: hizmetcep-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
