name: HizmetCep Test APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build DEBUG APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "APK bulundu:"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

    - name: Create GitHub Release and upload APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="debug-${{ github.run_id }}"
        APK="build/app/outputs/flutter-apk/app-debug.apk"

        echo "Release oluşturuluyor: $TAG"

        gh release create "$TAG" "$APK#HizmetCep Debug APK" \
          --repo "$GITHUB_REPOSITORY" \
          --title "HizmetCep Debug APK #${{ github.run_number }}" \
          --notes "GitHub Actions tarafından oluşturuldu. Run: ${{ github.run_id }}"

    - name: Verify GitHub Release APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="debug-${{ github.run_id }}"

        echo "Release doğrulanıyor..."

        gh release view "$TAG" \
          --repo "$GITHUB_REPOSITORY"

        echo ""
        echo "APK asset kontrolü..."

        gh release view "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name == "app-debug.apk") | "\(.name) | \(.size) bytes | \(.url)"'

        COUNT=$(gh release view "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '[.assets[] | select(.name == "app-debug.apk")] | length')

        if [ "$COUNT" != "1" ]; then
          echo "HATA: APK Release asset olarak bulunamadı."
          exit 1
        fi

        echo ""
        echo "========================================"
        echo "APK RELEASE OLARAK BAŞARIYLA YÜKLENDİ"
        echo "========================================"
        echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
