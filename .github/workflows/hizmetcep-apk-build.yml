name: HizmetCep Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hizmetcep-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build DEBUG APK
        run: flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK oluşturulamadı: $APK"
            exit 1
          fi

          echo "APK başarıyla oluşturuldu:"
          ls -lh "$APK"

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="debug-${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          echo "Release oluşturuluyor: $TAG"

          gh release create "$TAG" \
            "$APK#HizmetCep Debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HizmetCep Debug APK #${{ github.run_number }}" \
            --notes "GitHub Actions tarafından oluşturuldu. Run: ${{ github.run_id }}"

          echo "Release başarıyla oluşturuldu."

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="debug-${{ github.run_number }}"

          echo "Release doğrulanıyor..."

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"

          COUNT="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[] | select(.name == "app-debug.apk")] | length')"

          if [ "$COUNT" != "1" ]; then
            echo "HATA: app-debug.apk Release asset olarak bulunamadı."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BAŞARIYLA OLUŞTURULDU VE YÜKLENDİ"
          echo "========================================"
          echo "Release:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
