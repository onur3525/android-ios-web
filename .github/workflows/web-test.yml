name: HizmetCep Web Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
