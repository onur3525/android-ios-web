name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # ⚠ DEMO YAYINI: debug + mock. Release derleme her zaman gerçek
      # API modunda açılır ve API_BASE_URL ister; verilmezse açılışta
      # ApiClient hata fırlatır ve sayfa boş kalır. Production web
      # derlemesi ayrı iş akışındadır (web-production.yml).
      - name: Build Web
        run: flutter build web --debug --no-web-resources-cdn --dart-define=DATA_SOURCE=api --dart-define=API_BASE_URL=https://hizmetcep-backend.onrender.com/api/v1 --base-href "/android-ios-web/"

      # Paylaşım önizlemesi (WhatsApp vb.) TEST adresini göstersin: kaynak
      # index.html production adresini (hizmetcep.com) taşır; test yayınında
      # bağlantı önizleme adresleri test adresine çevrilir (16 Eki).
      - name: Paylaşım önizlemesi test adresine
        run: |
          set -eu
          sed -i 's#https://hizmetcep.com/og-paylasim.png#https://onur3525.github.io/android-ios-web/og-paylasim.png#g; s#<meta property="og:url" content="https://hizmetcep.com/">#<meta property="og:url" content="https://onur3525.github.io/android-ios-web/">#' build/web/index.html
          grep -q 'onur3525.github.io/android-ios-web/og-paylasim.png' build/web/index.html
          grep -q 'og:url" content="https://onur3525.github.io/android-ios-web/"' build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
