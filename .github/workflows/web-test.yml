name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # ⚠ DEMO YAYINI: debug + mock. Release derleme her zaman gerçek
      # API modunda açılır ve API_BASE_URL ister; verilmezse açılışta
      # ApiClient hata fırlatır ve sayfa boş kalır. Production web
      # derlemesi ayrı iş akışındadır (web-production.yml).
      - name: Build Web
        run: flutter build web --debug --dart-define=DATA_SOURCE=mock --base-href "/android-ios-web/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
