<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    HİZMETCEP — WEB GİRİŞ SAYFASI

    ⚠ BU DOSYA YALNIZ WEB İÇİNDİR. Android ve iOS derlemeleri
    `web/` klasörünü hiç okumaz; buradaki hiçbir değişiklik mobil
    davranışı etkilemez.

    ⚠ `<base href="$FLUTTER_BASE_HREF">` DEĞİŞTİRİLMEMELİDİR.
    `flutter build web --base-href` bu yer tutucuyu derleme anında
    doldurur. Elle sabit bir değer yazılırsa uygulama alt dizinde
    yayınlandığında varlıklar 404 döner.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HizmetCep — İzmir hizmet pazaryeri. Ücretsiz ilan verin, ustalardan teklif alın.">

  <!--
    ⚠ `viewport-fit=cover` + `user-scalable=no` KULLANILMADI.
    Kullanıcının yakınlaştırma hakkı elinden alınmaz; erişilebilirlik
    açısından gereklidir ve masaüstünde zaten anlamsızdır.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS'ta ana ekrana eklendiğinde -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HizmetCep">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Tarayıcı üst çubuğu rengi — marka mavisi (RC.blue) -->
  <meta name="theme-color" content="#1D6BE3">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>HizmetCep</title>

  <style>
    /*
      AÇILIŞ EKRANI

      ⚠ Flutter Web'in ilk karesi gelene kadar geçen sürede beyaz
      boş sayfa görünür. Native tarafta bu sorun `native_splash` ile
      çözülmüştü; web'in karşılığı bu bloktur.

      ⚠ Zemin rengi native açılış ekranıyla AYNI (#FFFFFF) tutuldu:
      marka sürekliliği için renk sıçraması olmamalı.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FFFFFF;
      /* Poppins uygulama içinde asset olarak gelir; burada yalnız
         açılış metni için sistem yazı tipi kullanılır. */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    #acilis {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FFFFFF;
      transition: opacity .25s ease;
    }

    #acilis img {
      width: 96px;
      height: 96px;
      /* ⚠ Oran korunur; ikon esnetilmez. */
      object-fit: contain;
    }

    #acilis .yazi {
      color: #5B6472;
      font-size: 14px;
      letter-spacing: .2px;
    }

    /* Flutter ilk kareyi çizince gövdeye eklenir. */
    body.hazir #acilis {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="acilis">
    <img src="icons/Icon-192.png" alt="HizmetCep">
    <div class="yazi">Yükleniyor…</div>
  </div>

  <script>
    // ⚠ Açılış örtüsü, Flutter ilk kareyi çizdiğinde kaldırılır.
    // `flutter_bootstrap.js` Flutter tarafından derleme anında
    // üretilir; bu dosyada elle script yönetimi YAPILMAZ.
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('hazir');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
