// ═══════════════════════════════════════════════════════════════
// ⚠ `kotlin-android` GEÇİCİ OLARAK GERİ EKLENDİ (14 Ağu)
//
// AGP 9.0'dan itibaren Kotlin desteği YERLEŞİKTİR ve eklenti
// uygulanırsa şu hatayla düşer:
//
//   Failed to apply plugin 'org.jetbrains.kotlin.android'
//   The 'org.jetbrains.kotlin.android' plugin is no longer required
//   for Kotlin support since AGP 9.0
//
// Ayrıca `kotlin` uzantısı iki kez kaydedilmiş olur.
//
// ⚠ AMA `android.builtInKotlin=false` iken bu kural TERSİNE DÖNER:
// yerleşik destek kapalıdır ve eklenti ZORUNLU olur. Kapıyı
// açmamızın nedeni `share_plus`ın henüz göç etmemiş olması
// (bkz. gradle.properties). Kapı kapanınca bu satır da silinecek.
//
// Kotlin kaynağımız tek dosya: MainActivity.kt — DOSYAYA
// DOKUNULMADI.
// ═══════════════════════════════════════════════════════════════
plugins {
    id "com.android.application"
    // ⚠ GERİ EKLENDİ — `android.builtInKotlin=false` ile ZORUNLU.
    //
    // Built-in Kotlin kapatıldığında AGP Kotlin kaynağını kendisi
    // derlemez; eski eklenti olmadan `MainActivity.kt` derlenmez.
    // Bu satır kapıyla BİRLİKTE yaşar: biri değişirse öteki de.
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ═══════════════════════════════════════════════════════════════
// RELEASE İMZALAMA
//
// ⚠ Gerçek keystore ve parolalar KAYNAK KODA KONMAZ.
// `android/key.properties` dosyası .gitignore'dadır; örneği
// `android/key.properties.example` içindedir.
//
// Dosya yoksa release build DEBUG ANAHTARA DÜŞMEZ — açık hata verir.
// (Play Store debug anahtarıyla imzalanmış paketi reddeder ve
//  debug anahtarı herkeste aynıdır: sahte güncelleme riski.)
// ═══════════════════════════════════════════════════════════════
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
}

android {
    namespace = "com.hizmetcep.app"
    // AndroidX bağımlılıkları compileSdk 36 gerektiriyor
    // (browser 1.9.0, activity 1.12.4, core 1.18.0, navigationevent 1.0.2)
    // ve Flutter eklentileri (google_sign_in_android, image_picker_android,
    // url_launcher_android, flutter_plugin_android_lifecycle) aynı tabanı ister.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
    compileOptions {
        // AGP 9 de Java 17 tabanını korur.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // ⚠ `kotlinOptions` BLOĞU KALDIRILDI — aşağıdaki `kotlin` bloğuna
    // taşındı. AGP 9'un yerleşik Kotlin desteği eski bloğu tanımaz:
    //
    //   Unresolved reference 'kotlinOptions'
    //

    defaultConfig {
        applicationId = "com.hizmetcep.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Anahtar yoksa SESSİZCE debug'a düşmez; build KIRILIR.
            signingConfig = hasKeystore ? signingConfigs.release : null
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }
}

// ── KOTLIN DERLEYİCİ SEÇENEKLERİ (AGP 9 yeni DSL) ──
//
// ⚠ Kotlin JVM hedefi Java sürümüyle AYNI olmalı; aksi hâlde
// "Inconsistent JVM-target compatibility" hatası alınır.
//
// ⚠ ÜST DÜZEY `kotlin {}` BLOĞU: hem built-in Kotlin'de hem
// `kotlin-android` eklentisinde geçerlidir. Eski
// `android { kotlinOptions { } }` yazımına dönmeye gerek yok.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Release derlemesi başlamadan ÖNCE anahtar kontrolü.
// Eksikse açık hata verir; yanlışlıkla imzasız/debug paket üretilmez.
tasks.configureEach { task ->
    if (task.name ==~ /(?i)(assemble|bundle)Release/) {
        task.doFirst {
            if (!hasKeystore) {
                throw new GradleException(
                    "\n" +
                    "═══════════════════════════════════════════════════════\n" +
                    " RELEASE İMZALAMA ANAHTARI BULUNAMADI\n" +
                    "═══════════════════════════════════════════════════════\n" +
                    " android/key.properties dosyası yok.\n" +
                    "\n" +
                    " 1) android/key.properties.example dosyasını kopyalayın:\n" +
                    "      cp android/key.properties.example android/key.properties\n" +
                    " 2) Keystore yolunu ve parolaları doldurun.\n" +
                    " 3) Ayrıntı: canli-kurulum/ANDROID_YAYINLAMA.md\n" +
                    "\n" +
                    " ⚠ Release paketi DEBUG anahtarıyla imzalanamaz:\n" +
                    "   debug anahtarı herkeste aynıdır ve Play Store reddeder.\n" +
                    "═══════════════════════════════════════════════════════\n")
            }
        }
    }
}

flutter { source = "../.." }

dependencies {
    // ANDROID 12+ SPLASH GERİYE UYUMLULUĞU
    //
    // `androidx.core:core-splashscreen` sayesinde TEK splash yüzeyi
    // API 21+ ile API 31+ arasında AYNI şekilde davranır ve
    // `setKeepOnScreenCondition` ile ekranda tutulabilir.
    //
    // ⚠ Bekleme UI thread'i BLOKLAMAZ: koşul her karede sorulur,
    // `Thread.sleep` KULLANILMAZ.
    implementation("androidx.core:core-splashscreen:1.0.1")
}
