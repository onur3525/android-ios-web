# ── BELLEK ──
#
# Codemagic derlemesi `JetifyTransform` içinde "Java heap space" ile
# düştü. Yığın 4G'den 6G'ye çıkarıldı ve metaspace sınırlandı.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# ── JETIFIER KAPALI ──
#
# ⚠ ASIL DÜZELTME BUDUR, bellek artışı yalnız emniyet payıdır.
#
# Jetifier, ESKİ `com.android.support` kitaplıklarını AndroidX'e
# yeniden yazmak içindir. Bu projede öyle bir bağımlılık YOKTUR
# (android/ altında tek bir `com.android.support` geçişi bulunmuyor;
# kullanılan eklentilerin tamamı AndroidX yerlisidir).
#
# Açık bırakıldığında Gradle, Flutter'ın gömülü jar'ları dâhil TÜM
# artefaktları dönüştürmeye çalışır; hatanın düştüğü yer tam olarak
# bu dönüşümdür (`armeabi_v7a_debug ... JetifyTransform`). Kapalıyken
# dönüşüm hiç çalışmaz.
#
# AGP 8 ile jetifier zaten kullanımdan kaldırılmıştır.
#
# ⚠ Eğer ileride gerçekten eski destek kitaplığı kullanan bir eklenti
# eklenirse derleme "support library" hatasıyla düşer; o zaman bu
# satır geri açılır — sessizce yanlış davranış oluşmaz.
android.enableJetifier=false

# ═══════════════════════════════════════════════════════════════
# BUILT-IN KOTLIN (AGP 9)
#
# ⚠ AGP 9'da Kotlin desteği YERLEŞİK ve VARSAYILAN. Bu satır onu
# açıkça teyit eder; `false` yazmak eski `kotlin-android` yoluna
# dönmek demektir ve o kaçış kapısı AGP 10'da KALKACAK.
#
# ⚠ Flutter 3.47 veya üstü gerektirir — CI'da 3.47.0 çalışıyor.
#
# ⚠ ÜÇÜNCÜ TARAF EKLENTİLER: bazı Flutter eklentileri kendi
# `android/build.gradle` dosyalarında hâlâ `kotlin-android`
# uyguluyor. Flutter tarafı AGP 9 için geçici bir uyumluluk katmanı
# ekledi, bu yüzden derleme kırılmıyor. O katman da AGP 10'da
# kalkacak; eklenti sürümleri AYRI bir turda yükseltilecek.
#
# Sorunlu bir modül çıkarsa projenin tamamını geri almak gerekmez;
# o modülde `enableKotlin = false` ile dışarıda bırakılabilir.
# ⚠ GEÇİCİ OLARAK KAPALI (14 Ağu, ürün kararı).
#
# `true` iken derleme KIRILIYORDU: `share_plus` kendi
# `android/build.gradle` dosyasında hâlâ `kotlin-android` uyguluyor
# ve AGP 9 bunu açık hatayla reddediyor. Ayrıca aynı dosyada
# `compileSdk` bildirilmemiş — AGP 9 onu da istiyor.
#
# ⚠ SÜRÜM YÜKSELTMEK ÇÖZMÜYOR. plus_plugins deposundaki 3745 numaralı
# kayıt (21 Oca 2026) tam bu hatayı bildiriyor ve HÂLÂ AÇIK: atanan
# yok, bağlı düzeltme yok. En güncel yama olan 12.0.2 dahil hiçbir
# share_plus sürümü built-in Kotlin'e geçmiş değil.
#
# ⚠ BU RESMÎ GEÇİŞ KAPISI. Google'ın AGP 9 notları ve JetBrains'in
# geçiş yazısı bunu belgeliyor. AGP 10'da KALKACAK (2026 ikinci
# yarısı bekleniyor) — o tarihe kadar eklentiler göç etmiş olmalı.
#
# ⚠ TOOLCHAIN HEDEFİ KORUNUYOR: AGP 9.3.0 · Gradle 9.5.0 ·
# Kotlin 2.4.10 · JDK 17 · compileSdk 36. Geri alınan tek şey
# Kotlin'in nasıl BAĞLANDIĞI.
#
# ⚠ Kapı kapatılınca `kotlin-android` app modülüne GERİ EKLENMEK
# ZORUNDA — yoksa Kotlin kaynağımız (MainActivity.kt) derlenmez.
android.builtInKotlin=false
