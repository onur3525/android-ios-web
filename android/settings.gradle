pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.3.0" apply false
    // ── ⚠ KOTLIN SÜRÜMÜ AÇIKÇA BİLDİRİLİR ──
    //
    // AGP 9, KGP 2.2.10'a çalışma zamanı bağımlılığı taşır ve daha
    // düşük bir sürüm bildirilirse SESSİZCE 2.2.10'a yükseltir.
    // 2.4.10 istiyorsak bunu yazmak zorundayız — yoksa hedefimiz
    // farkında olmadan 2.2.10'da kalır.
    //
    // ⚠ EKLENTİ UYGULANMIYOR (`apply false`) ve app modülünde de
    // UYGULANMAZ: AGP 9'da Kotlin desteği yerleşiktir. Sürüm bildirimi
    // yalnız hangi KGP'nin çözüleceğini belirler.
    id "org.jetbrains.kotlin.android" version "2.4.10" apply false
}
include ":app"
