# ═══════════════════════════════════════════════════════════════════
#  HİZMETCEP — API SÖZLEŞMESİ (OpenAPI 3.1)
# ═══════════════════════════════════════════════════════════════════
#
# Kaynak: "HizmetCep Nihai API ve İş Kuralları" belgesi, Sürüm 1.0.
# ⚠ O belge ESKİ KOD VE ESKİ ZIP'E ÜSTÜNDÜR (§31). Bu dosya belgeyi
#   makine tarafından doğrulanabilir biçime çevirir; ürün kararı
#   EKLEMEZ.
#
# ⚠ BELGENİN AÇIK BIRAKTIKLARI BURADA DA AÇIK BIRAKILDI (§30):
#   · ödeme sağlayıcısı seçilmedi → adapter ile soyutlanacak
#   · iletişim bedeli algoritması tanımlanmadı → ilk sürüm Admin fiyatı
#   · minimum teklif algoritması tanımlanmadı → ilk sürüm Admin fiyatı
#   Bunlar VARSAYIMLA DOLDURULMADI.
openapi: 3.1.0

info:
  title: HizmetCep API
  version: 1.0.0
  description: |
    İzmir hizmet pazaryeri. İki rol: Hizmet Alan (müşteri) ve
    Hizmet Veren (usta).

    TEMEL İLKELER (§1)
    - 1 ilan = 1 kategori/hizmet.
    - Aynı Hizmet Veren aynı ilana yalnızca 1 teklif verir.
    - Teklif geri çekilemez ve değiştirilemez.
    - İletişim açılmadan kişisel bilgiler MASKELİDİR ve mesajlaşma kapalıdır.
    - İletişim açılınca iki taraf için AYNI ANDA açılır.
    - E-posta hiçbir zaman karşı tarafa gösterilmez.
    - Yalnızca Hizmet Alan, Hizmet Veren'i 1-5 yıldız ve yorumla değerlendirir.
    - Her ilan için yalnızca 1 değerlendirme; kullanıcı silemez/değiştiremez.
    - İlan aktif süresi 30 saattir.
    - Para iadesi yoktur.

servers:
  - url: https://api.hizmetcep.com/v1
    description: Üretim
  - url: https://staging-api.hizmetcep.com/v1
    description: Hazırlık

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Roles
  - name: Categories
  - name: ServiceAreas
  - name: Listings
  - name: Offers
  - name: Communication
  - name: Wallet
  - name: FreeBenefits
  - name: Reviews
  - name: Messages
  - name: Notifications
  - name: Support
  - name: Admin

# ═══════════════════════════════════════════════════════════════════
#  BİLEŞENLER
# ═══════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ⚠ 401 istemcide MERKEZİ interceptor ile yönetilir (§28);
        her ekran ayrı ayrı ele almaz.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Önceki yanıtın `nextCursor` değeri (§2 cursor pagination).
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: |
        ⚠ FİNANSAL VE DURUM DEĞİŞTİREN POST'LARDA ZORUNLU (§25).
        Aynı anahtarla tekrarlanan istek İKİNCİ finansal hareketi ya da
        hak tüketimini OLUŞTURMAZ; ilk sonucu aynen döndürür.

  schemas:

    # ── ORTAK ──
    Error:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Alan bazlı doğrulama ayrıntıları.
        requestId: { type: string }
        retryable: { type: boolean }
      description: |
        ⚠ İSTEMCİ METNE DEĞİL `code` ALANINA GÖRE DAVRANIR (§3).
        Mesaj metni değişebilir; kod sözleşmedir.

    ErrorCode:
      type: string
      description: |
        ⚠ İSTEMCİ HTTP DURUMUNA DEĞİL BU KODA GÖRE DAVRANIR (§13).
        Aynı 409 iki farklı anlam taşıyabilir: "zaten teklif verdiniz"
        ile "iletişim zaten açık" kullanıcı için bambaşka sonuçlardır.

        ⚠ BU LİSTE FLUTTER `api_error_mapper.dart` İLE BİREBİRDİR.
        İstemcinin ele aldığı ama burada tanımsız olan bir kod,
        sunucunun asla göndermeyeceği ölü bir daldır; tersi ise
        istemcide genel hataya düşer. İki taraf ayrışmamalıdır.
      enum:
        # ── GENEL (HTTP karşılıkları) ──
        - VALIDATION_ERROR          # 400
        - UNAUTHENTICATED           # 401
        - UNAUTHORIZED              # 401/403 — eski ad, hâlâ kabul edilir
        - FORBIDDEN                 # 403
        - NOT_FOUND                 # 404
        - CONFLICT                  # 409
        - DUPLICATE_OPERATION       # 409
        - STATE_CONFLICT            # 409
        - INVALID_STATE             # 409/422 — durum uygun değil
        - BUSINESS_RULE_VIOLATION   # 422
        - RATE_LIMITED              # 429
        - INTERNAL_ERROR            # 500
        - EXTERNAL_SERVICE_ERROR    # 502/503

        # ── KİMLİK VE OTURUM ──
        - AUTH_FAILED               # kimlik doğrulanamadı
        - WRONG_PASSWORD            # mevcut şifre hatalı
        - OTP_REQUIRED              # SMS doğrulaması gerekiyor

        # ── TEKLİF ──
        - OFFER_ALREADY_EXISTS      # aynı ilana ikinci teklif (§1)
        - DUPLICATE_OFFER           # aynı anlam — eski ad
        - OWN_LISTING_OFFER         # kendi ilanına teklif verilemez

        # ── İLAN ──
        - LISTING_EXPIRED           # 30 saat doldu (§12)
        - LISTING_REMOVED           # admin kaldırdı (§13)
        - LISTING_CLOSED            # teklif kabul etmiyor (genel)

        # ── İLETİŞİM ──
        # ⚠ COMMUNICATION_ALREADY_OPEN BİR BAŞARISIZLIK DEĞİLDİR:
        # iletişim açma idempotenttir (§10). İstenen durum zaten
        # sağlanmıştır; istemci bunu başarı gibi ele alır ve kullanıcıya
        # hata GÖSTERMEZ.
        - COMMUNICATION_ALREADY_OPEN

        # ── PARA VE HAK ──
        - INSUFFICIENT_BALANCE      # cüzdan bakiyesi yetersiz
        - INSUFFICIENT_FUNDS        # ⚠ KARTIN bakiyesi — cüzdan DEĞİL
        - CARD_INSUFFICIENT_FUNDS   # aynı anlam — sağlayıcı adı
        - FREE_RIGHTS_EXHAUSTED     # ücretsiz hak kalmadı (§9)

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: |
            ⚠ KURUŞ CİNSİNDEN TAM SAYI (§2). Kayan noktalı sayı
            KULLANILMAZ; tek yöntem her yerde aynı uygulanır.
        currency: { type: string, enum: [TRY] }

    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor:
          type: [string, 'null']
          description: Son sayfada `null`.

    # ── ⚠ TEKLİF FİNANSMAN KAYNAĞI (§11) ──
    #
    # İstemcide `OfferFundingSource` olarak ZATEN VAR ve
    # `FREE_RIGHT` / `WALLET` değerleriyle sunucuya gidiyor.
    #
    # ⚠ ÜCRETSİZ HAK PARASAL BİR BAKİYE DEĞİLDİR. `FREE_RIGHT`
    # seçildiğinde TL bloke edilmez, capture edilmez, refund edilmez;
    # hak doğrudan TÜKETİLİR ve hiçbir kapanışta geri yüklenmez (§9).
    # Bu yüzden iki kaynak ayrı bir enum ile ayrılır — tutar alanına
    # sıfır yazarak temsil edilmez.
    OfferFundingSource:
      type: string
      enum: [WALLET, FREE_RIGHT]

    # ── DURUM ENUM'LARI (§24) ──
    UserStatus:        { type: string, enum: [ACTIVE, FROZEN, DELETED] }
    ListingStatus:     { type: string, enum: [ACTIVE, EXPIRED, USER_DELETED, ADMIN_REMOVED] }
    OfferStatus:       { type: string, enum: [ACTIVE, SELECTED, EXPIRED, CLOSED] }
    CommunicationState: { type: string, enum: [MASKED, OPENED] }
    PaymentHoldStatus: { type: string, enum: [NONE, HELD, CAPTURED, REFUNDED] }
    FreeBenefitStatus: { type: string, enum: [ACTIVE, EXPIRED, CANCELLED, EXHAUSTED] }
    ReviewStatus:      { type: string, enum: [PENDING_PUBLICATION, PUBLISHED, ADMIN_DELETED] }
    NotificationStatus: { type: string, enum: [UNREAD, READ, DELETED] }
    Role:              { type: string, enum: [CUSTOMER, PROVIDER] }

    # ── KULLANICI ──
    Address:
      type: object
      required: [cityId, districtId, neighborhoodId]
      properties:
        cityId: { type: string }
        districtId: { type: string }
        neighborhoodId: { type: string }
        cityName: { type: string, readOnly: true }
        districtName: { type: string, readOnly: true }
        neighborhoodName: { type: string, readOnly: true }
      description: ⚠ Her kullanıcının TEK adresi vardır (§4).

    Me:
      type: object
      required: [userId, firstName, lastName, phone, roles, activeRole, status, address]
      properties:
        userId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email:
          type: string
          format: email
          description: |
            ⚠ YALNIZ KENDİ PROFİLİNDE döner. Karşı tarafa HİÇBİR
            durumda gösterilmez (§1, §4, kabul testi 18).
        photoUrl: { type: [string, 'null'] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        activeRole: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        address: { $ref: '#/components/schemas/Address' }

    PartyPublic:
      type: object
      required: [userId, communication]
      properties:
        userId: { type: string }
        communication: { $ref: '#/components/schemas/CommunicationState' }
        firstName:
          type: [string, 'null']
          description: MASKED iken maskeli ("E***"), OPENED iken tam.
        lastName: { type: [string, 'null'] }
        phone:
          type: [string, 'null']
          description: |
            ⚠ MASKED iken SUNUCU BU ALANI GÖNDERMEZ (`null`).
            Yalnız arayüzde gizlemek güvenlik DEĞİLDİR (§28).
        photoUrl: { type: [string, 'null'] }
        cityName: { type: [string, 'null'] }
        districtName: { type: [string, 'null'] }
        neighborhoodName: { type: [string, 'null'] }
        rating:
          type: [number, 'null']
          description: Yayınlanmış değerlendirmelerin ortalaması, 1 ondalık.
        reviewCount: { type: integer }
        completedJobCount:
          type: integer
          description: ⚠ Teklif seçildiği anda +1 olur (§11).
      description: |
        ⚠ E-POSTA ALANI YOKTUR — bilerek. Şemada bulunmaması,
        yanlışlıkla doldurulmasını da engeller.

    # ── İLAN ──
    Listing:
      type: object
      required: [listingId, listingNo, ownerId, categoryId, serviceId, title, description, address, status, createdAt, expiresAt, offerCount]
      properties:
        listingId: { type: string }
        listingNo:
          type: string
          description: Kullanıcıya gösterilen referans; ilişkiler `listingId` üzerinden kurulur.
        ownerId: { type: string }
        categoryId: { type: string }
        serviceId:
          type: string
          description: ⚠ 1 ilan = 1 kategori/hizmet (§1).
        title: { type: string }
        description: { type: string }
        photoUrls:
          type: array
          items: { type: string }
        address: { $ref: '#/components/schemas/Address' }
        status: { $ref: '#/components/schemas/ListingStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: ⚠ createdAt + 30 saat (§1, §12).
        offerCount: { type: integer }
        selectedOfferId: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/PartyPublic' }

    ListingCreate:
      type: object
      required: [categoryId, serviceId, description]
      properties:
        categoryId: { type: string }
        serviceId: { type: string }
        description: { type: string, maxLength: 2000 }
        photoUrls: { type: array, items: { type: string } }

    # ── TEKLİF ──
    Offer:
      type: object
      required: [offerId, listingId, providerId, amount, note, status, communication, holdStatus, usedFreeBenefit, createdAt]
      properties:
        offerId: { type: string }
        listingId: { type: string }
        providerId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: string }
        status: { $ref: '#/components/schemas/OfferStatus' }
        communication: { $ref: '#/components/schemas/CommunicationState' }
        holdStatus: { $ref: '#/components/schemas/PaymentHoldStatus' }
        fundingSource:
          $ref: '#/components/schemas/OfferFundingSource'
        usedFreeBenefit:
          type: boolean
          description: |
            ⚠ `fundingSource == FREE_RIGHT` ile AYNI BİLGİ; geçiş
            dönemi için tutuldu. Yeni istemciler `fundingSource`
            okumalıdır.
        escrowBlocked:
          type: boolean
          description: |
            İstemci modelinde karşılığı var. ⚠ `FREE_RIGHT` teklifte
            DAİMA `false` — ücretsiz hak bloke edilmez.
        escrowConsumed:
          type: boolean
          description: |
            İletişim açıldığında `true` olur (HELD → CAPTURED).
            ⚠ Tüketilmiş bedel hiçbir kapanışta iade EDİLMEZ.
        createdAt: { type: string, format: date-time }
        provider: { $ref: '#/components/schemas/PartyPublic' }

    OfferCreate:
      type: object
      required: [amount, note]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: string, minLength: 1 }
      description: |
        ⚠ GÜNCELLEME/SİLME UCU YOKTUR (§27). Teklif geri çekilemez ve
        değiştirilemez (§1, kabul testi 2).

    # ── CÜZDAN ──
    WalletSummary:
      type: object
      required: [available, blocked]
      properties:
        available: { $ref: '#/components/schemas/Money' }
        blocked: { $ref: '#/components/schemas/Money' }

    WalletTransaction:
      type: object
      required: [walletTransactionId, kind, amount, createdAt]
      properties:
        walletTransactionId: { type: string }
        kind:
          type: string
          enum: [TOPUP, HOLD, CAPTURE, REFUND]
        amount: { $ref: '#/components/schemas/Money' }
        listingId:
          type: [string, 'null']
          description: |
            ⚠ İLGİLİ İLAN (§15). Bloke, tahsilat ve iade hareketleri
            bir teklife bağlıdır; bakiye YÜKLEME hareketi bağlı
            değildir ve `null` döner.

            İstemci bu bilgiyi başlık metninden ÇIKARMAZ; ilişki
            sunucudan gelir. Gelmezse ekran ilana gitme bağlantısını
            göstermez.
        offerId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      description: |
        ⚠ Kayıtlar APPEND-ONLY'dir; düzeltme yeni kayıtla yapılır.

    # ── ÜCRETSİZ HAK ──
    FreeBenefitGrant:
      type: object
      required: [benefitGrantId, total, remaining, status, grantedAt, expiresAt]
      properties:
        benefitGrantId: { type: string }
        total: { type: integer }
        remaining: { type: integer }
        status: { $ref: '#/components/schemas/FreeBenefitStatus' }
        grantedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: ⚠ 30/60/90 günlük paket bitişleri (§26).
      description: |
        ⚠ TÜKETİM SIRASI: en yakın bitiş ÖNCE tüketilir
        (kabul testi 10). Hak hiçbir kapanışta İADE EDİLMEZ
        (§11, §12, kabul testi 9).

    # ── DEĞERLENDİRME ──
    Review:
      type: object
      required: [reviewId, listingId, offerId, providerId, authorId, stars, text, status, createdAt]
      properties:
        reviewId: { type: string }
        listingId: { type: string }
        offerId: { type: string }
        providerId: { type: string }
        authorId: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        createdAt: { type: string, format: date-time }
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: |
            ⚠ Gönderimden 1 GÜN sonra doldurulur (§14). `null` iken
            yorum `PENDING_PUBLICATION`dır: listede ve ortalamada
            GÖRÜNMEZ.

            ⚠ YAYIN KARARI SUNUCUNUNDUR. İstemci cihaz saatiyle
            hesaplama yapmaz; `status` gelmediğinde yerel gecikme
            kuralına düşmesi geçiş dönemi köprüsüdür.

    ReviewCreate:
      type: object
      # ⚠ Yalnız `stars` zorunlu: yorum isteğe bağlıdır.
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        text:
          type: string
          maxLength: 1000
          description: |
            ⚠ YORUM İSTEĞE BAĞLIDIR — boş gönderilebilir (ürün kararı).
            Asgari kelime kuralı KALDIRILDI: kısa ama geçerli
            yorumları engelliyordu. Yalnız PUAN zorunludur.

            Fotoğraf alanı YOKTUR.

    # ── MESAJ / BİLDİRİM ──
    Message:
      type: object
      required: [messageId, conversationId, senderId, createdAt]
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        text: { type: [string, 'null'] }
        photoUrl: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [notificationId, type, status, createdAt]
      properties:
        notificationId: { type: string }
        type:
          type: string
          enum:
            - NEW_OFFER
            - OFFER_SELECTED
            - CONTACT_OPENED
            - NEW_MESSAGE
            - LISTING_EXPIRED
            - ADMIN_LISTING_REMOVED
            - BENEFIT_GRANTED
        status: { $ref: '#/components/schemas/NotificationStatus' }
        listingId: { type: [string, 'null'] }
        offerId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

  responses:
    BadRequest:      { description: VALIDATION_ERROR,        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized:    { description: UNAUTHENTICATED,         content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:       { description: FORBIDDEN,               content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:        { description: NOT_FOUND,               content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict:        { description: CONFLICT / DUPLICATE_OPERATION / STATE_CONFLICT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BusinessRule:    { description: BUSINESS_RULE_VIOLATION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited:     { description: RATE_LIMITED,            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

# ═══════════════════════════════════════════════════════════════════
#  YOLLAR
# ═══════════════════════════════════════════════════════════════════
#
# ⚠ AYNI ANLAM İÇİN ALTERNATİF UÇ AÇILMAZ (§27). Her işlemin tek
#   kanonik yolu vardır.
paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Kayıt (Ad, Soyad, Telefon, E-posta, Şifre + adres)
      description: |
        ⚠ Kayıt sonrası SMS doğrulaması yapılır; e-posta doğrulaması YAPILMAZ (§4).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Telefon+şifre veya e-posta+şifre ile giriş
      description: |
        ⚠ OTP DOĞRUDAN GİRİŞ YÖNTEMİ DEĞİLDİR (§4).
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /auth/google:
    post:
      tags: [Auth]
      summary: Google ile giriş (Android)
      description: |
        ⚠ iOS'ta Google düğmesi gizlidir; uç ortak kalır.
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: SMS kodu iste
      description: |
        ⚠ Yeniden gönderme 60 saniye. Cevap NÖTRDÜR — numaranın kayıtlı olup olmadığı sızdırılmaz.
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Oturumu kapat
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
