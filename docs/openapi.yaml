  /listings/{listingId}:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Listings]
      summary: İlan detayı
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Listings]
      summary: İlan güncelle — YALNIZ İZİN VERİLEN ALANLAR
      description: |
        ⚠ "Yayınlanmış ilan düzenlenemez" şeklinde GENEL BİR YASAK
        UYGULANMAZ. Kural şudur: yayınlanmış ilanda YALNIZCA izin
        verilen alanlar düzenlenebilir.

        ── İZİN VERİLEN (ALLOWED_AFTER_PUBLISH) ──

        · `description` — ilan açıklaması. Kullanıcı eksik anlattığı
          bir ayrıntıyı ekleyebilmelidir; işin KİMLİĞİNİ değiştirmez.

        ── YASAK (FORBIDDEN_AFTER_PUBLISH) ──

        · `title` — ⚠ BU ALAN İŞİN KİMLİĞİDİR. Uygulamada başlık
          serbest metin değil, SEÇİLEN HİZMETİN ADIDIR ("Kombi
          Bakımı"). Değiştirilmesi, hizmet verenlerin başka bir işe
          teklif vermiş duruma düşmesi demektir. İstemci bu alanı
          gönderse bile sunucu REDDETMELİDİR.
        · `categoryId` / `serviceId` — aynı gerekçe.
        · `location` / adres — teklifin dayandığı mesafe ve bölge
          şartını değiştirir.
        · `photoRefs` — teklif fotoğraflara bakılarak verilmiş olabilir.
        · `status`, `createdAt`, `expiresAt`, `selectedOfferId`,
          `ilanNo` — bunlar SİSTEM alanlarıdır; istemci yazamaz.
          İlan süresi uzatılamaz, durum elle değiştirilemez.

        ⚠ MEVCUT İSTEMCİ DAVRANIŞI: Flutter bu uca yalnız `title` ve
        `description` gönderebiliyor. `title` yukarıdaki gerekçeyle
        YASAK olduğundan, uygulamada tek düzenlenebilir alan
        `description`tır.

        ── DURUMA GÖRE DAVRANIŞ ──

        · `ACTIVE` + seçilmiş teklif YOK → izin verilen alanlar
          düzenlenebilir.
        · `ACTIVE` + `selectedOfferId != null` → ⚠ PATCH TAMAMEN
          REDDEDİLİR. `description` DAHİL hiçbir alan değiştirilemez.

          Gerekçe: seçilmiş teklif bulunduğu anda iş tamamlanmış
          sayılır. Hizmet veren teklifini o AÇIKLAMAYA bakarak verdi;
          açıklamanın sonradan değişmesi, teklifin dayandığı şartları
          değiştirir.
        · `EXPIRED` → PATCH REDDEDİLİR. Süresi dolmuş ilan
          düzenlenerek ACTIVE'e döndürülemez.
        · `USER_DELETED` → PATCH REDDEDİLİR.
        · `ADMIN_REMOVED` → PATCH REDDEDİLİR. Yeniden açma YALNIZ
          `POST /admin/listings/{listingId}/reactivate` ile yapılır.

        ⚠ BU KONTROLLER SUNUCUDA YAPILIR. İstemcide alanın
        düzenlenebilir görünmesi, sunucunun kabul edeceği anlamına
        GELMEZ (§9). Sunucu ayrıca sahiplik denetimi yapar: başka
        kullanıcının ilanı değiştirilemez → 403.

        ⚠ `description` YALNIZ `selectedOfferId == null` iken
        değiştirilebilir.

        ⚠ SUNUCU ZORUNLU KONTROLLERİ: yetki · ilan sahipliği ·
        `status` · `selectedOfferId` · izin verilmeyen alan · kapanmış
        durumlar. İstemcide düğmenin gizlenmesi güvenlik DEĞİLDİR.

        Ret kodu: `STATE_CONFLICT` (409) — yeni hata kodu
        tanımlanmadı, mevcut sözleşme yeterlidir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                description:
                  type: string
                  maxLength: 2000
                  description: Yayın sonrası düzenlenebilen TEK alan.
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [Listings]
      summary: İlanı sil — TEK KANONİK UÇ
      description: |
        ⚠ `POST /listings/{listingId}/cancel` KALDIRILDI. Aynı iş için
        iki uç bırakılmaz; kanonik uç budur.

        ⚠ `cancel` adında yeni bir `ListingStatus` OLUŞTURULMAZ ve
        eski `CANCELLED` durumu GERİ GETİRİLMEZ. Kullanıcı sildiğinde
        durum `USER_DELETED` olur; admin kaldırdığında
        `ADMIN_REMOVED`. İkisi BİRBİRİNE KARIŞTIRILMAZ ve bu uç admin
        kaldırma ucuyla BİRLEŞTİRİLMEZ.

        Silinen ilan geri getirilemez. Açılmamış normal blokeler iade
        edilir; açılmış bedel ve ücretsiz hak İADE EDİLMEZ (§11).

        ⚠ SUNUCU ZORUNLU KONTROLLERİ: başkasının ilanı silinemez ·
        yetkisiz kullanıcı silemez · silinmesi yasak durumdaki ilan
        silinemez.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Başarılı }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ⚠ `POST /listings/{listingId}/cancel` KALDIRILDI.
  #
  # Aynı işi `DELETE /listings/{listingId}` yapıyordu; iki kanonik uç
  # bırakılmaz. İstemcideki `cancel()` metodu, repository ve port
  # bağlantıları da temizlendi.
  /offers:
    post:
      tags: [Offers]
      summary: Teklif ver
      description: |
        ⚠ Aynı hizmet veren aynı ilana İKİNCİ teklifi veremez → 409 OFFER_ALREADY_EXISTS.
        ⚠ Teklif geri çekilemez ve değiştirilemez (§1) — güncelleme/silme ucu YOKTUR.
        ⚠ Yetersiz bakiye → 422 INSUFFICIENT_BALANCE. Ücretsiz hak varsa TL bloke OLUŞMAZ (§9).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /offers/my:
    get:
      tags: [Offers]
      summary: Verdiğim teklifler
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /offers/{offerId}/communication:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Communication]
      summary: İletişimi aç
      description: |
        ⚠ İKİ TARAF İÇİN AYNI ANDA açılır ve SÜRESİZDİR (§8).
        ⚠ İDEMPOTENT: tekrar istek ikinci kez ücret almaz; sunucu COMMUNICATION_ALREADY_OPEN döner ve bu BİR HATA DEĞİLDİR (§10).
        ⚠ Bedel HİZMET VERENDEN alınır; hizmet alan hiçbir aşamada ödemez.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /contact/{offerId}:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Communication]
      summary: İletişim durumu
      description: |
        ⚠ MASKED iken telefon SUNUCUDAN HİÇ GÖNDERİLMEZ; arayüzde gizlemek güvenlik değildir (§28).
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /listings/{listingId}/selected-offer:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Communication]
      summary: Teklifi seç
      description: |
        ⚠ TEK ATOMİK AKIŞ (§25): teklif SELECTED olur · `selectedOfferId` yazılır · tamamlanan iş sayısı +1 · diğer teklifler CLOSED · iletişimi AÇILMAMIŞ blokeler iade · açılmış bedel ve ücretsiz hak İADE EDİLMEZ.
        ⚠ İLAN DURUMU DEĞİŞMEZ: ACTIVE kalır. Tamamlanmışlık `selectedOfferId` ilişkisinden türetilir (§24).
        ⚠ İkinci istek ikinci tamamlanan iş ya da ikinci finansal işlem ÜRETMEZ.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /listings/{listingId}/review:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Reviews]
      summary: Değerlendirme yaz
      description: |
        ⚠ Yalnız Hizmet Alan → Hizmet Veren. PUAN ZORUNLU (1-5),
        YORUM İSTEĞE BAĞLI (en fazla 1000 karakter, alt sınır YOK),
        FOTOĞRAF YOK.

        ⚠ Sunucu boş yorumu REDDETMEZ; puansız isteği reddeder.
        ⚠ Her ilan için tek değerlendirme; ikinci istek → 409. Kullanıcı silemez/değiştiremez.
        ⚠ PENDING_PUBLICATION ile başlar, 1 GÜN sonra PUBLISHED olur.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Başarılı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /providers/{providerId}/reviews:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Reviews]
      summary: Hizmet verenin YAYINLANMIŞ değerlendirmeleri
      description: |
        ⚠ Yalnız PUBLISHED kayıtlar döner; ortalama ve dağılım onlardan hesaplanır (§14).
        ⚠ "Değerlendirmelerim" ekranı da BU UCU kullanır — kendi kimliğini verir. Ayrı bir /reviews/me ucu AÇILMAZ (§27).
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Özet + sayfalı liste
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, count]
                properties:
                  average:
                    type: [number, 'null']
                    description: |
                      Yayınlanmış yorumların ortalaması, 1 ondalık.
